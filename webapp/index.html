<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Карман</title>
    <style>
      :root {
        --color-phone: #0e0e0e;
        --color-surface: #1a1a1a;
        --color-surface-2: #2b2b2b;
        --color-surface-3: #353535;
        --color-yellow: #f5c400;
        --color-lime: #d2e85c;
        --color-gold: #f0c93a;
        --color-coral: #f2746b;
        --color-coral-deep: #e45b54;
        --color-ink: #161616;
        --color-muted: #8d8d8d;
        --color-chip: #2f2f2f;
        --color-snow: #f2f2f2;
        --color-sheet: #111111;
        --color-nav: #141414;
        --color-chip-idle: #3a3a3a;
        --color-count: #6b5b73;
        --radius-card: 1.7rem;
        --radius-chip: 1.35rem;
        --radius-sheet: 2.1rem;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --nav-height: 72px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--color-phone);
        color: #ffffff;
        font-family: system-ui, sans-serif;
        color-scheme: dark;
      }
      #app-shell {
        padding: max(var(--space-4), env(safe-area-inset-top, 0px)) 20px
          calc(var(--space-4) + var(--nav-height) + env(safe-area-inset-bottom, 0px));
        background: var(--color-phone);
        color: #ffffff;
        min-height: 100%;
      }
      body[data-nav-visible="false"] #app-shell {
        padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
      }
      #capture-strip {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        column-gap: var(--space-2);
        row-gap: var(--space-4);
      }
      #capture-strip[hidden] {
        display: none !important;
      }
      .pocket-title {
        margin: 0;
        font: 800 24px / 1.05 system-ui, sans-serif;
        letter-spacing: -0.03em;
        color: #ffffff;
      }
      #capture-form {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin: 0;
      }
      #capture-field {
        width: 100%;
        flex: 1;
        min-width: 0;
        display: block;
        resize: none;
        overflow: hidden;
        min-height: 48px;
        padding: 14px 20px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--color-chip);
        color: #ffffff;
        font: 400 16px / 1.2 system-ui, sans-serif;
      }
      #capture-field::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }
      #capture-field:focus {
        outline: 2px solid var(--color-yellow);
        outline-offset: 0;
      }
      #ideas-counter {
        display: inline-flex;
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--color-count);
        color: #ffffff;
        font: 600 13px / 1 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-align: center;
      }
      #capture-submit {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 9px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--color-yellow);
        color: var(--color-ink);
        font: 600 13px / 1 system-ui, sans-serif;
        cursor: pointer;
      }
      #status-line {
        margin: var(--space-2) 0 0;
        min-height: 1.3em;
        color: var(--color-muted);
        font: 400 12.5px / 1.3 system-ui, sans-serif;
      }
      #status-line.destructive {
        color: var(--color-coral);
      }
      #idea-list {
        margin-top: var(--space-3);
        color: #ffffff;
      }
      .list-skeleton {
        height: 48px;
        border-radius: var(--radius-chip);
        background: var(--color-chip);
        opacity: 0.55;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .shelf-chips {
        display: flex;
        gap: var(--space-2);
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: var(--space-1);
      }
      .shelf-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        height: 52px;
        min-width: 48px;
        padding: 0 10px;
        border: 0;
        border-radius: 18px;
        background: var(--color-chip-idle);
        color: #ffffff;
        cursor: pointer;
      }
      .shelf-chip.selected {
        min-width: 56px;
        padding: 0 12px;
        background: var(--color-yellow);
        color: var(--color-ink);
      }
      .shelf-chip-label {
        font: 600 13px / 1 system-ui, sans-serif;
        white-space: nowrap;
      }
      .shelf-chip-hint {
        margin-top: 6px;
        font: 400 10px / 1 system-ui, sans-serif;
        color: var(--color-muted);
      }
      .shelf-chip.selected .shelf-chip-hint {
        color: rgba(22, 22, 22, 0.8);
        font-weight: 500;
      }
      .shelf-stack {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        margin-top: var(--space-3);
      }
      .shelf-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .shelf-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: 10px 14px;
        border-radius: 16px;
        background: var(--color-chip);
      }
      .shelf-title {
        margin: 0;
        font: 600 13px / 1.3 system-ui, sans-serif;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      .shelf-heading-count {
        color: var(--color-muted);
        font: 400 12px / 1 system-ui, sans-serif;
      }
      .idea-tone-card,
      .source-card {
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-card);
        padding: 14px 18px 12px;
      }
      .tone-lime { background: var(--color-lime); color: var(--color-ink); }
      .tone-gold { background: var(--color-gold); color: var(--color-ink); }
      .tone-coral { background: var(--color-coral); color: var(--color-ink); }
      .tone-snow { background: var(--color-snow); color: var(--color-ink); }
      .idea-row {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        font: 700 17px / 1.15 system-ui, sans-serif;
        letter-spacing: -0.02em;
        cursor: pointer;
        -webkit-user-select: text;
        user-select: text;
      }
      .idea-tone-meta,
      .source-url {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        color: rgba(22, 22, 22, 0.7);
        font: 400 12px / 1.3 system-ui, sans-serif;
      }
      .source-url {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .idea-tone-cta,
      .source-card-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .source-card-footer {
        justify-content: space-between;
        border-radius: 999px;
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.85);
      }
      .tone-snow .source-card-footer {
        background: var(--color-ink);
      }
      .idea-open-badge {
        border-radius: 999px;
        padding: 6px 14px;
        background: #ffffff;
        color: rgba(22, 22, 22, 0.8);
        font: 500 11px / 1 system-ui, sans-serif;
      }
      .source-open-hint {
        padding: 0 8px;
        background: transparent;
        color: rgba(22, 22, 22, 0.7);
        font: 500 11px / 1 system-ui, sans-serif;
      }
      .tone-snow .idea-open-badge {
        background: var(--color-surface-3);
        color: rgba(255, 255, 255, 0.9);
      }
      .tone-snow .source-open-hint {
        color: rgba(255, 255, 255, 0.9);
      }
      .idea-card-header {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-height: 44pt;
        color: #ffffff;
      }
      .idea-card-back {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44pt;
        min-height: 44pt;
        width: 44pt;
        height: 44pt;
        box-sizing: border-box;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: var(--color-chip);
        color: #ffffff;
        cursor: pointer;
      }
      .idea-card-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 800 22px / 1.1 system-ui, sans-serif;
        letter-spacing: -0.03em;
      }
      .idea-card-body {
        display: block;
        width: 100%;
        margin-top: var(--space-4);
        min-height: 44pt;
        overflow: visible;
        overflow-wrap: anywhere;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--color-muted);
        text-align: left;
        white-space: pre-wrap;
        -webkit-user-select: text;
        user-select: text;
        font: 400 12.5px / 1.55 system-ui, sans-serif;
        cursor: pointer;
      }
      .idea-card-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        color: rgba(255, 255, 255, 0.85);
        font: 400 13px / 1 system-ui, sans-serif;
      }
      .idea-card-meta-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .idea-card-meta-split {
        color: rgba(255, 255, 255, 0.25);
      }
      button.idea-card-delete {
        display: inline-flex;
        min-height: 44pt;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        margin-top: 14px;
        margin-left: auto;
        padding: 6px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--color-chip);
        color: #ffffff;
        font: 500 11px / 1 system-ui, sans-serif;
        cursor: pointer;
      }
      .idea-card-delete-row {
        display: flex;
        justify-content: flex-end;
      }
      .idea-related {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 12px;
      }
      .pocket-ideas[hidden],
      .pocket-sources[hidden] {
        display: none !important;
      }
      .bottom-nav {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 24px;
        border-radius: 999px;
        background: var(--color-nav);
      }
      .bottom-nav-item {
        display: inline-flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
      }
      .bottom-nav-item[aria-current="page"] {
        background: var(--color-yellow);
        color: var(--color-ink);
      }
      .bottom-nav-stub {
        pointer-events: none;
        color: rgba(255, 255, 255, 0.25);
        cursor: default;
      }
      .sources-pane {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      .sources-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }
      button.sources-add {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        align-self: flex-start;
        min-height: 44px;
        box-sizing: border-box;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: var(--color-yellow);
        color: var(--color-ink);
        font: 600 13px / 1 system-ui, sans-serif;
        cursor: pointer;
      }
      .sources-count {
        display: inline-flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--color-count);
        color: #ffffff;
        font: 600 13px / 1 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .sources-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--space-3);
        margin-top: var(--space-2);
      }
      .sources-heading h1 {
        margin: 0;
        font: 800 24px / 1 system-ui, sans-serif;
        letter-spacing: -0.03em;
      }
      .sources-heading span {
        color: var(--color-muted);
        font: 500 13px / 1 system-ui, sans-serif;
      }
      .source-abbrev-row {
        display: flex;
        gap: var(--space-2);
        overflow-x: auto;
        flex-wrap: nowrap;
      }
      .source-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .source-abbrev {
        display: inline-flex;
        min-width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--color-ink);
        color: #ffffff;
        font: 700 12px / 1 system-ui, sans-serif;
      }
      .source-stack {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        margin-top: var(--space-4);
      }
      button.source-row-delete {
        display: inline-flex;
        min-width: 44pt;
        min-height: 44pt;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px 14px;
        border: 0;
        border-radius: 999px;
        background: #ffffff;
        color: var(--color-ink);
        font: 500 11px / 1 system-ui, sans-serif;
        cursor: pointer;
      }
      .sources-overlay-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
        background: var(--color-coral);
        color: var(--color-ink);
        border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
        min-height: calc(100dvh - 80px);
        flex: 1;
      }
      .sources-overlay-chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        background: #000000;
        padding: max(1.5rem, env(safe-area-inset-top, 0px)) 20px 12px;
      }
      button.sources-overlay-back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: var(--color-chip);
        color: #ffffff;
        cursor: pointer;
      }
      button.sources-overlay-cancel {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: var(--color-yellow);
        color: var(--color-ink);
        font: 600 13px / 1 system-ui, sans-serif;
        cursor: pointer;
      }
      .sources-overlay {
        display: flex !important;
        flex-direction: column !important;
        background: #000000 !important;
        inset: 0 !important;
        top: 0 !important;
        height: 100dvh !important;
        max-height: none !important;
        border-radius: 0 !important;
      }
      .sources-overlay-title {
        margin: 0;
        font: 800 26px / 1.15 system-ui, sans-serif;
        letter-spacing: -0.03em;
      }
      .sources-overlay-form label {
        display: block;
        font: 600 14px / 1.3 system-ui, sans-serif;
      }
      .sources-overlay-form input {
        display: block;
        width: 100%;
        height: 48px;
        margin-top: 8px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: var(--color-ink);
        color: #ffffff;
        font: 400 16px / 1 system-ui, sans-serif;
      }
      .sources-overlay-form input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }
      .source-suggest-label {
        margin: 8px 0 0;
        font: 600 14px / 1 system-ui, sans-serif;
      }
      .source-suggest-row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        flex-wrap: nowrap;
      }
      .source-suggest-chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        height: 44px;
        min-width: 3.6rem;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: var(--color-ink);
        color: rgba(255, 255, 255, 0.75);
        cursor: pointer;
      }
      .source-suggest-chip span:first-child {
        font: 600 13px / 1 system-ui, sans-serif;
      }
      .source-suggest-chip span:last-child {
        margin-top: 4px;
        font: 400 10px / 1 system-ui, sans-serif;
        opacity: 0.8;
      }
      button.sources-overlay-save {
        margin-top: auto;
        height: 52px;
        border: 0;
        border-radius: 999px;
        background: var(--color-ink);
        color: #ffffff;
        font: 600 15px / 1 system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="capture-strip">
        <h1 class="pocket-title">Карман</h1>
        <span id="ideas-counter">__IDEAS_COUNT__</span>
        <form id="capture-form" method="post" action="/api/ideas" onsubmit="return false;">
          <textarea
            id="capture-field"
            name="text"
            placeholder="Идея"
            rows="1"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
          ></textarea>
          <button id="capture-submit" type="submit">+ Захватить</button>
        </form>
      </div>
      <p id="status-line" hidden></p>
      <div id="idea-list">
        <div class="list-skeleton" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
