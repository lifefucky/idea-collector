[project]
name = "idea-collector"
version = "0.1.0"
description = "Single-operator Telegram idea pocket"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "aiohttp>=3.10",
    "httpx>=0.27",
]

[project.scripts]
idea-collector = "idea_collector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
